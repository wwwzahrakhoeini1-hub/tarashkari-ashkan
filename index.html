
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تراشکاری اشکان | خدمات تراشکاری</title>
<meta name="description" content="تراشکاری اشکان؛ انجام خدمات تراشکاری، ساخت قطعات و سفارش‌های اختصاصی.">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Tahoma, Arial, sans-serif;
    background:#101214;
    color:#f5f5f5;
    line-height:1.9;
}

a{
    text-decoration:none;
    color:inherit;
}

.container{
    width:90%;
    max-width:1100px;
    margin:auto;
}

/* Header */
header{
    background:#151719;
    border-bottom:1px solid #333;
    position:sticky;
    top:0;
    z-index:100;
}

.nav{
    min-height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:#f0a83a;
}

nav{
    display:flex;
    gap:22px;
}

nav a{
    color:#ddd;
    transition:.3s;
}

nav a:hover{
    color:#f0a83a;
}

/* Hero */
.hero{
    min-height:600px;
    display:flex;
    align-items:center;
    text-align:center;
    background:
        radial-gradient(circle at center,#272b2f 0%,#101214 65%);
}

.hero-content{
    width:100%;
}

.badge{
    display:inline-block;
    border:1px solid #555;
    color:#f0a83a;
    padding:5px 15px;
    border-radius:30px;
    margin-bottom:20px;
    font-size:14px;
}

.hero h1{
    font-size:48px;
    margin-bottom:15px;
}

.hero h1 span{
    color:#f0a83a;
}

.hero p{
    max-width:700px;
    margin:0 auto 30px;
    color:#ccc;
    font-size:18px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    display:inline-block;
    padding:12px 25px;
    border-radius:8px;
    font-weight:bold;
    transition:.3s;
}

.btn-primary{
    background:#f0a83a;
    color:#111;
}

.btn-primary:hover{
    transform:translateY(-2px);
    background:#ffc05b;
}

.btn-secondary{
    border:1px solid #777;
    color:#fff;
}

.btn-secondary:hover{
    border-color:#f0a83a;
    color:#f0a83a;
}

/* Sections */
section{
    padding:80px 0;
}

.section-title{
    text-align:center;
    margin-bottom:45px;
}

.section-title h2{
    font-size:32px;
    margin-bottom:8px;
}

.section-title p{
    color:#aaa;
}

/* Services */
.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.card{
    background:#191c1f;
    border:1px solid #303438;
    border-radius:14px;
    padding:30px 22px;
    text-align:center;
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#f0a83a;
}

.icon{
    font-size:42px;
    margin-bottom:15px;
}

.card h3{
    margin-bottom:10px;
    color:#f0a83a;
}

.card p{
    color:#bbb;
    font-size:15px;
}

/* About */
.about{
    background:#151719;
}

.about-box{
    max-width:850px;
    margin:auto;
    text-align:center;
}

.about-box p{
    color:#ccc;
    font-size:17px;
}

/* Portfolio */
.portfolio{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.work{
    min-height:190px;
    border-radius:14px;
    background:linear-gradient(145deg,#292d31,#17191b);
    border:1px solid #333;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
}

.work h3{
    color:#f0a83a;
    margin-bottom:8px;
}

.work p{
    color:#aaa;
    font-size:14px;
}

/* Contact */
.contact-box{
    max-width:700px;
    margin:auto;
    background:#191c1f;
    border:1px solid #303438;
    border-radius:16px;
    padding:40px 25px;
    text-align:center;
}

.phone{
    display:inline-block;
    margin-top:20px;
    font-size:25px;
    color:#f0a83a;
    direction:ltr;
}

/* Footer */
footer{
    background:#0b0d0e;
    border-top:1px solid #292c2f;
    text-align:center;
    padding:25px 15px;
    color:#888;
    font-size:14px;
}

/* Mobile */
@media(max-width:800px){
    .nav{
        flex-direction:column;
        padding:15px 0;
    }

    nav{
        gap:14px;
        font-size:14px;
    }

    .hero{
        min-height:520px;
    }

    .hero h1{
        font-size:35px;
    }

    .hero p{
        font-size:16px;
    }

    .cards,
    .portfolio{
        grid-template-columns:1fr;
    }

    section{
        padding:60px 0;
    }
}
</style>
</head>

<header>

        <nav>

            <a href="#services">خدمات</a>
            <a href="#about">درباره ما</a>
            <a href="#portfolio">نمونه‌کارها</a>
            <a href="#contact">تماس</a>
        </nav>
    </div>
</header>

<main>

<section class="hero" id="home">
    <div class="container hero-content">

        <div class="badge">خدمات تراشکاری و ساخت قطعات</div>

        <h1>
            تراشکاری <span>اشکان</span>

        <p>

        </p>

        <div class="buttons">

                تماس با کارگاه
            </a>

            <a class="btn btn-secondary" href="#services">
                مشاهده خدمات
            </a>
        </div>

    </div>
</section>
