<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تراشکاری اشکان | خدمات تراشکاری در زنجان</title>

<meta name="description" content="تراشکاری اشکان در زنجان؛ ارائه خدمات تراشکاری ثابت و سیار، ساخت قطعات صنعتی و کشاورزی، جوش آرگون، تعمیر پمپ، جک هیدرولیک و گیربکس.">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#0b0d0f;
    color:#f4f4f4;
    line-height:1.9;
}

a{
    text-decoration:none;
    color:inherit;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(11,13,15,.94);
    backdrop-filter:blur(12px);
    border-bottom:1px solid #25292d;
}

.nav{
    max-width:1100px;
    margin:auto;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:#ff8a00;
}

.logo span{
    color:#fff;
}

nav{
    display:flex;
    gap:22px;
}

nav a{
    color:#ccc;
    font-size:14px;
    transition:.3s;
}

nav a:hover{
    color:#ff8a00;
}

/* HERO */

.hero{
    min-height:620px;
    display:flex;
    align-items:center;
    position:relative;
    overflow:hidden;

    background:
    linear-gradient(90deg,rgba(5,6,7,.96),rgba(5,6,7,.72),rgba(5,6,7,.45)),
    url("https://raw.githubusercontent.com/wwwzahrakhoeini1-hub/tarashkari-ashkan/main/ashkan-work-5.jpg");

    background-size:cover;
    background-position:center;
}

.hero-content{
    max-width:1100px;
    width:100%;
    margin:auto;
    padding:80px 25px;
}

.badge{
    display:inline-block;
    padding:7px 16px;
    border:1px solid #ff8a00;
    color:#ff9b2f;
    border-radius:30px;
    font-size:13px;
    margin-bottom:20px;
    background:rgba(255,138,0,.08);
}

.hero h1{
    font-size:48px;
    line-height:1.4;
    margin-bottom:15px;
}

.hero h1 span{
    color:#ff8a00;
}

.hero p{
    max-width:650px;
    color:#d0d0d0;
    font-size:17px;
    margin-bottom:30px;
}

.buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.btn{
    padding:13px 24px;
    border-radius:9px;
    font-weight:bold;
    transition:.3s;
    display:inline-block;
}

.btn-primary{
    background:#ff8a00;
    color:#111;
}

.btn-primary:hover{
    background:#ff9f2e;
    transform:translateY(-2px);
}

.btn-outline{
    border:1px solid #555;
    background:rgba(255,255,255,.05);
    color:white;
}

.btn-outline:hover{
    border-color:#ff8a00;
    color:#ff8a00;
}

/* INFO BAR */

.info-bar{
    max-width:1050px;
    margin:-35px auto 60px;
    position:relative;
    z-index:5;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    background:#15181b;
    border:1px solid #292d31;
    border-radius:15px;
    overflow:hidden;
}

.info-item{
    padding:22px;
    text-align:center;
    border-left:1px solid #292d31;
}

.info-item:last-child{
    border-left:none;
}

.info-item strong{
    display:block;
    color:#ff8a00;
    font-size:16px;
    margin-bottom:4px;
}

.info-item span{
    color:#aaa;
    font-size:13px;
}

/* GENERAL */

.section{
    max-width:1100px;
    margin:auto;
    padding:75px 20px;
}

.section-title{
    text-align:center;
    margin-bottom:45px;
}

.section-title small{
    color:#ff8a00;
    font-size:13px;
}

.section-title h2{
    font-size:32px;
    margin-top:5px;
}

.section-title p{
    color:#999;
    font-size:14px;
    margin-top:8px;
}

/* ABOUT */

.about{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:45px;
    align-items:center;
}

.about-image img{
    width:100%;
    height:350px;
    object-fit:cover;
    border-radius:18px;
    border:1px solid #292d31;
}

.about-text h3{
    font-size:28px;
    margin-bottom:15px;
}

.about-text h3 span{
    color:#ff8a00;
}

.about-text p{
    color:#bcbcbc;
    font-size:15px;
}

.about-list{
    margin-top:20px;
    display:grid;
    gap:10px;
}

.about-list div{
    background:#15181b;
    border-right:3px solid #ff8a00;
    padding:10px 14px;
    border-radius:7px;
    color:#ddd;
    font-size:14px;
}

/* SERVICES */

.services{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.service{
    background:linear-gradient(145deg,#171a1d,#101214);
    border:1px solid #292d31;
    border-radius:14px;
    padding:22px;
    transition:.3s;
}

.service:hover{
    transform:translateY(-4px);
    border-color:#ff8a00;
}

.service-icon{
    width:45px;
    height:45px;
    border-radius:10px;
    background:rgba(255,138,0,.1);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
    margin-bottom:12px;
}

.service h3{
    font-size:17px;
    margin-bottom:7px;
}

.service p{
    color:#999;
    font-size:13px;
}

/* GALLERY */

.gallery{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.gallery-item{
    overflow:hidden;
    border-radius:15px;
    border:1px solid #292d31;
    background:#15181b;
}

.gallery-item img{
    width:100%;
    height:260px;
    display:block;
    object-fit:cover;
    transition:.5s;
}

.gallery-item:hover img{
    transform:scale(1.06);
}

/* CONTACT */

.contact-box{
    background:
    linear-gradient(135deg,#171a1d,#0e1012);
    border:1px solid #292d31;
    border-radius:20px;
    padding:45px 30px;
    text-align:center;
}

.contact-box h2{
    font-size:30px;
    margin-bottom:10px;
}

.contact-box h2 span{
    color:#ff8a00;
}

.contact-box p{
    color:#aaa;
    margin-bottom:25px;
}

.contact-buttons{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}

/* ADDRESS */

.address{
    text-align:center;
    margin-top:30px;
    color:#aaa;
    font-size:14px;
}

.address strong{
    color:#fff;
}

/* FOOTER */

footer{
    border-top:1px solid #25292d;
    text-align:center;
    padding:30px 20px;
    color:#777;
    font-size:13px;
}

footer strong{
    color:#ff8a00;
}

/* MOBILE */

    .nav{
        padding:14px 15px;
    }

    .logo{
        font-size:18px;

    nav{
        display:none;
    }

    .hero p{
        font-size:15px;

        grid-template-columns:1fr;
